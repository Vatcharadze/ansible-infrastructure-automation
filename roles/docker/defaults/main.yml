---
docker_packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - software-properties-common
  - python3-pip


docker_gpg_url: https://download.docker.com/linux/ubuntu/gpg
docker_packages_state: present
docker_apt_repository: "deb [arch={{ docker_architecture }} signed-by={{ docker_keyring_path }}] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
docker_keyring_path: /etc/apt/keyrings/docker.asc
docker_architecture: amd64

docker_plugins:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

docker_users: [] #on default its empty, add your docker user here